<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaiten Sushi Calc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module" src="src/ui/shell.ts"></script>
</head>
<body>
  <header class="shell">
    <nav class="tabs" role="tablist" aria-label="Screens">
      <button id="tab-sushi" class="tab" type="button" role="tab" data-screen="sushi" aria-selected="false"></button>
      <button id="tab-split" class="tab" type="button" role="tab" data-screen="split" aria-selected="false"></button>
    </nav>
    <span id="app-version" class="app-version"></span>
  </header>
  <div id="sushi-screen">
    <div id="app"></div>
    <div id="modal-root"></div>
  </div>
  <div id="split-screen" hidden>
    <div id="split-root"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
